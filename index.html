<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Invoice Scanner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .drag-over {
        border-color: #3b82f6;
        background-color: rgba(59, 130, 246, 0.08);
      }
    </style>
  </head>
  <body class="bg-slate-100 min-h-screen text-slate-800">
    <div class="max-w-6xl mx-auto py-10 px-4">
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
        <section class="bg-white rounded-2xl shadow-lg p-6 border border-slate-200">
          <div class="flex items-center justify-between mb-5">
            <div>
              <p class="text-sm font-medium text-blue-600 uppercase tracking-wide">Invoice Intake</p>
              <h1 class="text-2xl font-bold">Scan Invoice</h1>
            </div>
          </div>

          <div id="dropZone" class="relative border-2 border-dashed border-slate-300 rounded-2xl p-6 text-center bg-slate-50 transition-all duration-200 hover:border-blue-400 hover:bg-blue-50 cursor-pointer">
            <input id="invoiceInput" type="file" accept="image/png, image/jpeg" class="absolute inset-0 opacity-0 cursor-pointer" />
            <div class="space-y-4">
              <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-blue-100 text-blue-600">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M7 16a4 4 0 01-.88-7.9A5.5 5.5 0 0116.5 6a4.5 4.5 0 01.5 8.9H7zm5-8v6m0 0l2.5-2.5M12 14l-2.5-2.5"/>
                </svg>
              </div>
              <div>
                <p class="text-lg font-semibold text-slate-700">Drop invoice image here</p>
                <p class="text-sm text-slate-500">or click to browse JPG/PNG files</p>
              </div>
            </div>
          </div>

          <div class="mt-6 rounded-2xl border border-slate-200 bg-slate-50 p-3 min-h-[260px] flex items-center justify-center overflow-hidden">
            <img id="imagePreview" alt="Invoice preview" class="hidden max-h-[300px] rounded-xl shadow-sm object-contain" />
            <div id="previewPlaceholder" class="text-sm text-slate-400">No image selected yet.</div>
          </div>
        </section>

        <section class="bg-white rounded-2xl shadow-lg p-6 border border-slate-200">
          <div class="mb-6">
            <p class="text-sm font-medium text-violet-600 uppercase tracking-wide">Extracted Details</p>
            <h2 class="text-2xl font-bold">Invoice Information</h2>
          </div>

          <form id="invoiceForm" class="space-y-5">
            <div>
              <label for="vendorName" class="block text-sm font-medium text-slate-700 mb-1">Vendor Name</label>
              <input id="vendorName" type="text" class="w-full rounded-xl border border-slate-300 bg-slate-50 px-3 py-2.5 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100" placeholder="Acme Supplies" />
            </div>

            <div>
              <label for="invoiceDate" class="block text-sm font-medium text-slate-700 mb-1">Invoice Date</label>
              <input id="invoiceDate" type="text" class="w-full rounded-xl border border-slate-300 bg-slate-50 px-3 py-2.5 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100" placeholder="MM/DD/YYYY" />
            </div>

            <div>
              <label for="totalAmount" class="block text-sm font-medium text-slate-700 mb-1">Total Amount</label>
              <input id="totalAmount" type="text" class="w-full rounded-xl border border-slate-300 bg-slate-50 px-3 py-2.5 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100" placeholder="$0.00" />
            </div>

            <div>
              <label for="category" class="block text-sm font-medium text-slate-700 mb-1">Category</label>
              <select id="category" class="w-full rounded-xl border border-slate-300 bg-slate-50 px-3 py-2.5 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100">
                <option value="">Select category</option>
                <option value="Office Supplies">Office Supplies</option>
                <option value="Software">Software</option>
                <option value="Marketing">Marketing</option>
                <option value="Travel">Travel</option>
                <option value="Utilities">Utilities</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <button id="scanButton" type="button" class="w-full inline-flex items-center justify-center gap-2 rounded-xl bg-slate-900 px-4 py-3 text-sm font-semibold text-white shadow hover:bg-slate-800 transition disabled:cursor-not-allowed disabled:opacity-60">
              <span id="scanLabel">Scan Invoice</span>
              <svg id="scanSpinner" class="hidden h-4 w-4 animate-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
            </button>
          </form>
        </section>
      </div>
    </div>

    <script>
      const dropZone = document.getElementById('dropZone');
      const invoiceInput = document.getElementById('invoiceInput');
      const imagePreview = document.getElementById('imagePreview');
      const previewPlaceholder = document.getElementById('previewPlaceholder');
      const scanButton = document.getElementById('scanButton');
      const scanLabel = document.getElementById('scanLabel');
      const scanSpinner = document.getElementById('scanSpinner');

      const formFields = {
        vendorName: document.getElementById('vendorName'),
        invoiceDate: document.getElementById('invoiceDate'),
        totalAmount: document.getElementById('totalAmount'),
        category: document.getElementById('category')
      };

      let selectedFile = null;

      function setPreview(file) {
        if (!file) {
          imagePreview.classList.add('hidden');
          previewPlaceholder.classList.remove('hidden');
          return;
        }

        const reader = new FileReader();
        reader.onload = (event) => {
          imagePreview.src = event.target.result;
          imagePreview.classList.remove('hidden');
          previewPlaceholder.classList.add('hidden');
        };
        reader.readAsDataURL(file);
      }

      function handleFile(file) {
        if (!file) return;
        if (!['image/jpeg', 'image/png'].includes(file.type)) {
          alert('Please upload a JPG or PNG image.');
          return;
        }

        selectedFile = file;
        setPreview(file);
      }

      invoiceInput.addEventListener('change', (event) => {
        const file = event.target.files[0];
        handleFile(file);
      });

      ['dragenter', 'dragover'].forEach(eventName => {
        dropZone.addEventListener(eventName, (event) => {
          event.preventDefault();
          dropZone.classList.add('drag-over');
        });
      });

      ['dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, (event) => {
          event.preventDefault();
          dropZone.classList.remove('drag-over');
        });
      });

      dropZone.addEventListener('drop', (event) => {
        const file = event.dataTransfer.files[0];
        handleFile(file);
      });

      function populateForm(data) {
        if (data.vendor_name) formFields.vendorName.value = data.vendor_name;
        if (data.date) formFields.invoiceDate.value = data.date;
        if (data.total_amount) formFields.totalAmount.value = data.total_amount;

        if (data.category) {
          formFields.category.value = data.category;
        }
      }

      async function scanInvoice() {
        if (!selectedFile) {
          alert('Please upload an invoice image first.');
          return;
        }

        const formData = new FormData();
        formData.append('file', selectedFile);

        scanButton.disabled = true;
        scanLabel.textContent = 'Scanning...';
        scanSpinner.classList.remove('hidden');

        try {
          const response = await fetch('http://127.0.0.1:8000/api/extract-invoice', {
            method: 'POST',
            body: formData,
          });

          if (!response.ok) {
            const errorText = await response.text();
            throw new Error(errorText || 'Failed to scan invoice');
          }

          const result = await response.json();
          populateForm(result);
        } catch (error) {
          console.error(error);
          alert('Unable to scan invoice. Please try again.');
        } finally {
          scanButton.disabled = false;
          scanLabel.textContent = 'Scan Invoice';
          scanSpinner.classList.add('hidden');
        }
      }

      scanButton.addEventListener('click', scanInvoice);
    </script>
  </body>
</html>
